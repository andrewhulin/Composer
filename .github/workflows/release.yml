# Pushing a tag like v0.1.1 builds Design Composer, signs the update and publishes a GitHub Release.
# Installed copies read latest.json from the newest release and offer the update in the title bar.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in apps/desktop/src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build the universal app, sign the update and publish the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Design Composer ${{ github.ref_name }}
          releaseBody: |
            What changed is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

            Already installed? Composer finds this update within four hours, or now with ⌘K → Check for updates.
            First install: see "Install a release" in the README.
          releaseDraft: false
          prerelease: false
